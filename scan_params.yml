# ══════════════════════════════════════════════
#  스캐너 파라미터 — 폰에서 이 파일만 고치면 됩니다
#  GitHub 앱 -> 코드 -> scan_params.yml -> 연필 -> 수정 -> 커밋
# ══════════════════════════════════════════════

# ── 후보 조건 ──
BODY_MAX_PCT: 15.0      # 몸통 최대 비율. 후보 적으면 20까지
MIN_RANGE_ATR: 0.4      # 최소 캔들범위 (죽은 종목 제외)
VOL_MIN: 1.0            # 최소 거래량 배수
MAX_STOP_PCT: 10.0      # 손절폭 너무 큰 종목 제외

MIN_VALUE_KR: 1000000000    # 국장 거래대금 10억
MIN_VALUE_US: 10000000      # 미장 거래대금 $10M
MIN_PRICE_KR: 1000
MIN_PRICE_US: 5

# ── 출력 ──
TOP_A: 10               # A그룹 (상세)
TOP_B: 10               # B그룹 (한 줄)
CHASE_PCT: 0.5          # 진입 허용 구간 (돌파가 대비 %)
NEWS_PER_STOCK: 2       # 종목당 뉴스 개수

# ── 점수 가중치 (합계 100 유지) ──
W_VOLUME: 25            # 거래량 배수
W_QUALITY: 20           # 도지 품질 (몸통 얇기 + 잠자리형)
W_52WH: 20              # 52주 고가 근접도 (George-Hwang 2004)
W_POSITION: 15          # MA20 근접 · 20일저점 · MA60 위
W_STOP: 12              # 손절폭 좁을수록 가점
W_LIQUIDITY: 8          # 거래대금

# ── 감점 (단기반전 회피) ──
PEN_SURGE: 15           # 최근 5일 급등 감점 최대치
SURGE_PCT: 15.0         # 5일 수익률이 이 이상이면 감점 시작
PEN_TURNOVER: 10        # 회전율 과열 감점 최대치
TURNOVER_HOT: 0.05      # 일거래대금/시총 이 이상이면 과열

# ── 패턴 유형 판정 ──
NEAR52_PCT: 1.0        # 52주 고가 대비 이 % 이내면 신고가권
PULLBACK_PCT: 2.0      # MA20 터치 허용 오차 %
VOL_SURGE: 3.0         # 거래량 급증 기준 배수
BONUS_COMBO: 5         # 유형 하나 겹칠 때마다 가점
