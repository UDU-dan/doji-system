# ══════════════════════════════════════════════
#  도지 시스템 파라미터
#  폰에서 이 파일만 수정하면 다음 실행에 바로 반영됩니다.
#  GitHub 앱 -> 코드 -> params.yml -> 연필 아이콘 -> 수정 -> 커밋
# ══════════════════════════════════════════════

# ── 도지 판정 ──
BODY_MAX_PCT: 8.0        # 몸통이 전체범위의 몇 % 이하 (조이려면 낮게)
MIN_RANGE_ATR: 0.5       # 최소 캔들범위 (ATR14 배수)
DRAGON_LOWER: 60.0       # 잠자리형 아래꼬리 최소 %
DRAGON_UPPER: 15.0       # 잠자리형 위꼬리 최대 %

# ── 위치 필터 (하락 OR 지지선) ──
FALL_DAYS: 5             # 하락 판정 기간
FALL_PCT: 5.0            # 하락 최소 %
SUPPORT_ATR: 0.25        # 지지선 터치 허용오차 (ATR 배수)

# ── 거래량 / 유동성 ──
VOL_MULT: 1.2            # 20일 평균 대비 배수
MIN_VALUE_KRW: 1000000000  # 거래대금 하한 (10억)
MIN_PRICE: 1000

# ── 돌파 / 리스크 ──
BREAK_BUFFER: 0.002      # 돌파 여유 0.2%
STOP_ATR_BUF: 0.15       # 손절 버퍼 (ATR 배수)
MAX_STOP_PCT: 5.0        # 손절폭 상한 % (초과시 진입 포기)
RISK_PCT: 0.5            # 1회 리스크 (계좌 %)
TIME_STOP_DAYS: 5        # 시간 손절
