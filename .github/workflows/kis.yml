name: 국장 실시간 감시

on:
  workflow_dispatch:
    inputs:
      days:
        description: '리스트 생성용 최근 며칠'
        required: true
        default: '5'
      universe:
        description: '대상 종목 수'
        required: true
        default: '800'
  schedule:
    - cron: '50 23 * * 0-4'

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 관심종목 생성
        run: mkdir -p results && python daily.py --market kr --days ${{ github.event.inputs.days || '5' }} --universe ${{ github.event.inputs.universe || '800' }} 2>&1 | tee results/scan_log.txt

      - name: 리스트 발송
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash notify.sh kr watchlist

      - name: 실시간 감시
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kis_watch.py
