name: 지정가 감시 봇

on:
  workflow_dispatch:
    inputs:
      market:
        description: '시장'
        required: true
        default: 'kr'
        type: choice
        options: ['kr', 'us']
  schedule:
    - cron: '40 23 * * 0-4'
    - cron: '50 12 * * 1-5'

permissions:
  contents: write

env:
  MK: ${{ github.event.inputs.market || (github.event.schedule == '50 12 * * 1-5' && 'us' || 'kr') }}

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 감시 실행
        env:
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python alert_bot.py --market "$MK" --max-minutes 400

      - name: 감시목록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f manual_watch.json || true
          git diff --staged --quiet || git commit -m "감시목록 $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push || true
