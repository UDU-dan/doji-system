name: 도지 검증

on:
  workflow_dispatch:
    inputs:
      market:
        description: '시장'
        required: true
        default: 'kr'
        type: choice
        options: ['kr', 'us']
      days:
        description: '며칠 전까지'
        required: true
        default: '5'
      universe:
        description: '대상 종목 수'
        required: true
        default: '800'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 검증 실행
        run: mkdir -p results && python verify.py --market ${{ github.event.inputs.market }} --days ${{ github.event.inputs.days }} --universe ${{ github.event.inputs.universe }} 2>&1 | tee results/verify_log.txt

      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.run_id }}
          path: results/
          retention-days: 3

      - name: 텔레그램 발송
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash notify.sh ${{ github.event.inputs.market }} verify
