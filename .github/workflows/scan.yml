name: 도지 관심종목 스캔

on:
  workflow_dispatch:
    inputs:
      market:
        description: '시장 (kr 또는 us)'
        required: true
        default: 'kr'
        type: choice
        options: ['kr', 'us']
      universe:
        description: '대상 종목 수'
        required: true
        default: '800'
  schedule:
    - cron: '30 23 * * 0-4'   # 08:30 KST 월~금 → 국장
    - cron: '0 12 * * 1-5'    # 21:00 KST 월~금 → 미장 (개장 전)

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          for i in 1 2 3; do
            pip install --no-cache-dir -r requirements.txt && break
            sleep 20
          done

      - name: 시장 결정
        id: mk
        run: |
          if [ -n "${{ github.event.inputs.market }}" ]; then
            echo "market=${{ github.event.inputs.market }}" >> $GITHUB_OUTPUT
            echo "uni=${{ github.event.inputs.universe }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 12 * * 1-5" ]; then
            echo "market=us" >> $GITHUB_OUTPUT
            echo "uni=2500" >> $GITHUB_OUTPUT
          else
            echo "market=kr" >> $GITHUB_OUTPUT
            echo "uni=800" >> $GITHUB_OUTPUT
          fi

      - name: 스캔 실행
        run: |
          mkdir -p results
          python scan.py --market ${{ steps.mk.outputs.market }} \
                         --universe ${{ steps.mk.outputs.uni }} \
            2>&1 | tee results/scan_log.txt

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/ || true
          git diff --staged --quiet || git commit -m "관심종목 ${{ steps.mk.outputs.market }} $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push || true

      - name: 텔레그램 발송
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          MK: ${{ steps.mk.outputs.market }}
        run: |
          if [ -z "$TG_TOKEN" ]; then echo "토큰 없음"; exit 0; fi
          send() {
            curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$1" > /dev/null
          }
          F="results/watchlist_${MK}.txt"
          if [ -s "$F" ]; then
            split -b 3500 "$F" /tmp/part_
            for p in /tmp/part_*; do send "$(cat $p)"; sleep 1; done
            echo "발송 완료"
          else
            TAIL=$(tail -c 1200 results/scan_log.txt 2>/dev/null || echo "로그 없음")
            send "[${MK}] 후보 0건 또는 실행 실패

$TAIL"
            echo "0건 알림 발송"
          fi
