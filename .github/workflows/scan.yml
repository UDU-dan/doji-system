name: 관심종목 스캔

on:
  workflow_dispatch:
    inputs:
      market:
        description: '시장'
        required: true
        default: 'kr'
        type: choice
        options: ['kr', 'us']
      days:
        description: '최근 며칠 신호까지'
        required: true
        default: '5'
      universe:
        description: '대상 종목 수'
        required: true
        default: '800'

permissions:
  contents: read

env:
  MK: ${{ github.event.inputs.market || (github.event.schedule == '0 13 * * 1-5' && 'us' || 'kr') }}
  DAYS: ${{ github.event.inputs.days || '5' }}
  UNI: ${{ github.event.inputs.universe || (github.event.schedule == '0 13 * * 1-5' && '1500' || '800') }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 스캔 실행
        run: mkdir -p results && python daily.py --market "$MK" --days "$DAYS" --universe "$UNI" 2>&1 | tee results/scan_log.txt

      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-${{ github.run_id }}
          path: results/
          retention-days: 3

      - name: 텔레그램 발송
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash notify.sh "$MK" watchlist
