name: 도지 관심종목 스캔

on:
  workflow_dispatch:
    inputs:
      market:
        description: '시장'
        required: true
        default: 'kr'
        type: choice
        options: ['kr', 'us']
      universe:
        description: '대상 종목 수'
        required: true
        default: '800'
  schedule:
    - cron: '30 23 * * 0-4'
    - cron: '0 12 * * 1-5'

permissions:
  contents: write

env:
  MK: ${{ github.event.inputs.market || 'kr' }}
  UNI: ${{ github.event.inputs.universe || '800' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 스캔 실행
        run: mkdir -p results && python scan.py --market "$MK" --universe "$UNI" 2>&1 | tee results/scan_log.txt

      - name: 결과 커밋
        if: always()
        run: bash commit_results.sh "${{ github.ref_name }}"

      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchlist
          path: results/

      - name: 텔레그램 발송
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash notify.sh "$MK"
