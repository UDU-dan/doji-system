name: 미장 장전 스캔

on:
  workflow_dispatch:
    inputs:
      universe:
        description: '유니버스 크기'
        required: true
        default: '2000'
  schedule:
    - cron: '0 13 * * 1-5'

permissions:
  contents: read

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 스캔 실행
        run: mkdir -p results && python scan.py --market us --universe ${{ github.event.inputs.universe || '2000' }} 2>&1 | tee results/scan_log.txt

      - name: 텔레그램 발송
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash notify.sh us
