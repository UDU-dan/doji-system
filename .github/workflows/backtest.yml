name: 도지 백테스트

on:
  workflow_dispatch:
    inputs:
      months:
        description: '검증 기간 (개월)'
        required: true
        default: '12'
      universe:
        description: '대상 종목 수 (시총 상위)'
        required: true
        default: '500'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 백테스트 실행
        run: |
          mkdir -p results
          python backtest.py \
            --months ${{ github.event.inputs.months }} \
            --universe ${{ github.event.inputs.universe }} \
            2>&1 | tee results/result.txt

      - name: 결과를 저장소에 커밋 (폰에서 바로 보기)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/ || true
          git diff --staged --quiet || git commit -m "백테스트 결과 $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push || true

      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-result
          path: results/

      - name: 텔레그램 발송
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ]; then echo "텔레그램 미설정 - 건너뜀"; exit 0; fi
          MSG=$(tail -c 3200 results/result.txt 2>/dev/null || echo "실행 실패")
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=<pre>$MSG</pre>" \
            --data-urlencode "parse_mode=HTML" > /dev/null
          echo "텔레그램 발송 완료"
